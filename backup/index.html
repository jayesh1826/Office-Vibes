<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Vibes - Clear Desk Workspace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dual Background Layers -->
  <div class="window-view" id="bg-layer-1"></div>
  <div class="window-view" id="bg-layer-2"></div>

  <!-- Fullscreen "Ghar Ja" Alert (Shows when Shift > 8 Hours without checkout) -->
  <div id="ghar-ja-overlay" class="ghar-ja-overlay hidden">
    <div class="ghar-ja-content">
      <h1>🚪 GHAR JA DOST! 🏠</h1>
      <p>8-Hour Shift is Completed. Log Check-Out & Go Home!</p>
      <button class="ghar-ja-btn" onclick="dismissGharJa()">Okay, Checking Out!</button>
    </div>
  </div>

  <!-- Main Desk Surface Layout -->
  <div class="desk-surface">
    
    <!-- Top Desk Header -->
    <header class="desk-header">
      <div class="desk-lamp">
        <button onclick="toggleLamp()" id="lamp-btn">💡 Desk Lamp OFF</button>
      </div>

      <!-- Shift Logger & Break Action Controls -->
      <div class="shift-logger">
        <span id="shift-status-tag" class="shift-tag status-out">🔴 OFF SHIFT</span>
        <button id="shift-btn" onclick="toggleShiftLog()">⏰ Log Check-In</button>
        <button id="break-btn" class="break-btn hidden" onclick="toggleBreakLog()">☕ Take Break</button>
      </div>

      <div class="window-presets">
        <button onclick="triggerRandomBg()">🎲 Next Vibe Background</button>
      </div>
    </header>

    <!-- CENTER AREA: Countdown Front & Center on Main Page -->
    <main class="desk-center-clear">
      
      <!-- MAIN PAGE TRANSPARENT WHITE COUNTDOWN CLOCK -->
      <div id="main-shift-clock" class="main-shift-clock hidden">
        <div class="shift-tag-label">⏳ TIME LEFT TO GO HOME</div>
        <div class="transparent-white-clock" id="countdown-front-text">08:00:00</div>
      </div>

      <!-- REACTION POPUP BANNER WITH BELL NOTIFICATION ICON -->
      <div id="reaction-popup" class="reaction-popup hidden">
        <span class="reaction-icon-badge">🔔</span>
        <span id="reaction-text" class="reaction-text"></span>
      </div>

      <!-- Pop-up Laptop Screen Frame -->
      <div id="laptop-screen-modal" class="laptop-screen-modal hidden">
        <div class="modal-header">
          <span>💻 WORK LAPTOP MONITOR</span>
          <button class="close-modal-btn" onclick="toggleLaptop()">✕ Close</button>
        </div>
        <div class="monitor-screen">
          <div id="yt-player"></div>
        </div>
      </div>

      <!-- Pop-up File Folder Focus Modal -->
      <div id="folder-files-modal" class="folder-modal hidden">
        <div class="modal-header">
          <span>📁 PROJECT FOCUS DOSSIER</span>
          <button class="close-modal-btn" onclick="toggleFolderModal()">✕ Close</button>
        </div>
        <div class="folder-content">
          <label>Set Pomodoro Duration:</label>
          <div class="preset-time-btns">
            <button onclick="setTimerDuration(15)">15m</button>
            <button onclick="setTimerDuration(25)" class="active">25m</button>
            <button onclick="setTimerDuration(50)">50m</button>
            <button onclick="setTimerDuration(90)">90m</button>
          </div>
          <button class="start-focus-btn" onclick="startFocusSession()">🎯 Start Pomodoro</button>
        </div>
      </div>

    </main>

    <!-- Background General Corporate Sentences Loop -->
    <div class="sentence-wrapper">
      <p id="floating-text" class="floating-text"></p>
    </div>

    <!-- Bottom Dock: Player + Laptop & Folder Icons -->
    <div class="bottom-dock-container">
      <div class="dock-card">
        
        <div class="dock-art">
          <div class="art-box" id="art-box">💼</div>
        </div>

        <div class="dock-content">
          <div class="dock-top-row">
            <div class="dock-track-info">
              <span class="artist-label" id="dock-artist">CURRENT OFFICE TASK</span>
              <h3 class="track-label" id="dock-title">Select Task Vibe...</h3>
            </div>
            
            <div class="dock-actions">
              <a id="yt-external-link" href="#" target="_blank" class="yt-link-btn" title="Open in YT Music">🎵 YT Music</a>
              <button class="icon-btn" title="Pin Task Goal">📌</button>
              <button class="icon-btn" title="Attach Document">📎</button>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="dock-progress">
            <span class="time-text" id="time-current">0:00</span>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <span class="time-text" id="time-total">--:--</span>
          </div>

          <!-- Controls + Laptop & File Folder Quick Icons -->
          <div class="dock-controls">
            <button class="icon-btn feature-btn" onclick="toggleLaptop()" title="Open Laptop Video">💻</button>
            <button class="icon-btn feature-btn" onclick="toggleFolderModal()" title="Open Folder & Focus">📁</button>
            <button class="icon-btn task-btn" id="dock-prev-btn" title="Previous Task">💼⏮</button>
            <button class="office-play-btn" id="dock-play-btn" title="Coffee Break / Work Flow">
              <span id="play-icon">☕</span>
            </button>
            <button class="icon-btn task-btn" id="dock-next-btn" title="Next Task">⏭💼</button>
            <button class="icon-btn small-btn" title="Focus Analytics">📊</button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/app.js"></script>
</body>
</html>
